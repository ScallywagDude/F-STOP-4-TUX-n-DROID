// F-STOP on Steam Deck. Runs when the game finds a controller.
joy_name "Steam Deck"
joy_advanced 1
joy_advaxisx 3
joy_advaxisy 1
joy_advaxisz 0
joy_advaxisr 2
joy_advaxisu 4
joy_advaxisv 0
joy_forwardsensitivity -1
joy_sidesensitivity 1
joy_pitchsensitivity 1.5
joy_yawsensitivity -2.2
joy_lowend 0.65
joy_lowmap 0.15
joy_accelscale 1.4
joy_response_move 5
joy_response_look 1
joy_autoaimdampen 1
joyadvancedupdate
crosshair 1

// triggers: camera
bind "Z AXIS NEG" "+attack"		// R2: open the viewfinder, take a photo, place a photo
bind "Z AXIS POS" "+attack2"	// L2: close the viewfinder, cancel

// shoulders and D-pad up/down: zoom the camera, or resize the photo being placed
bind "R_SHOULDER" "+alt1"		// R1: zoom in, bigger (see fstop_bumper_resize; the Deck uses its right trackpad)
bind "L_SHOULDER" "+alt2"		// L1: zoom out, smaller
bind "POV_UP" "+alt1"
bind "POV_DOWN" "+alt2"

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "invnext"		// switch held item

// sticks
bind "STICK1" "+speed"			// L3: run
bind "STICK2" "toggle_duck"		// R3: stay crouched

// the rest
bind "POV_LEFT" "save quick"
bind "POV_RIGHT" "load quick"
bind "START" "gameui_activate"
bind "BACK" "pause"

joystick 1
+jlook
